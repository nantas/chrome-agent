# Capability Registry — machine-readable SSOT for all chrome-agent capabilities.
# Every implemented capability must have an entry here.
# doctor --check capabilities cross-validates this file against code, specs, and AGENTS.md.

convert:
  normalizations:
    - name: semantic_heading_pairs
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.heading_normalization
  mirrors:
    - name: crawl_html_conversion
      implemented_in: scripts/lib/crawl_conversion.py
      capability: convert
      execution_path: scrapling_traversal
      strategy_variant: config_driven
      input_format: html_generic
      relationship: mirror
      kernel: scripts/lib/extraction/converter.py
      equivalence: tests/crawl-strategy-conversion.test.mjs
  cleanup_ops:
    - name: strip_fandom_infobox_tables
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: convert_ambox_to_text
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: unwrap_image_wrappers
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: unwrap_list_item_wrappers
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_empty_inline_tags
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_empty_paragraphs
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: unwrap_nowrap_spans
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_footer
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_edit_links
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_skip_links
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_category_links
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: convert_nested_images
      implemented_in: scripts/lib/extraction/preprocessor.py
      strategy_field: extraction.cleanup
    - name: strip_empty_parens
      implemented_in: scripts/lib/extraction/converter.py
      strategy_field: extraction.cleanup
    - name: fix_separators
      implemented_in: scripts/lib/extraction/converter.py
      strategy_field: extraction.cleanup
    - name: normalize_internal
      implemented_in: scripts/lib/extraction/converter.py
      strategy_field: extraction.cleanup

extract:
  infobox_handlers:
    - name: text
      implemented_in: scripts/lib/extraction/infobox.py
      strategy_field: extraction.infobox_field_handlers
    - name: extract_cur_id
      implemented_in: scripts/lib/extraction/infobox.py
      strategy_field: extraction.infobox_field_handlers
    - name: count_images
      implemented_in: scripts/lib/extraction/infobox.py
      strategy_field: extraction.infobox_field_handlers
    - name: dedup_pools
      implemented_in: scripts/lib/extraction/infobox.py
      strategy_field: extraction.infobox_field_handlers
    - name: simplify_collection
      implemented_in: scripts/lib/extraction/infobox.py
      strategy_field: extraction.infobox_field_handlers

  special_capabilities:
    - name: card_stats
      implemented_in: scripts/pipeline/converters/card_stats.py
      strategy_field: capabilities
    - name: link_fixer
      implemented_in: scripts/pipeline/converters/link_fixer.py
      strategy_field: capabilities

fetch:
  kernels:
    - name: content_admission
      implemented_in: scripts/lib/content_admission.py
      capability: fetch
      sub_capability: content_admission
      execution_path: shared
      strategy_variant: generic
      input_format: html_generic
      relationship: kernel
      equivalence: tests/test_content_admission.py
      consumers:
        - scripts/explore/probe_chain.py
        - scripts/explore/sample_converter.py
        - scripts/chrome-agent-cli.mjs
        - scripts/pipeline/pipeline/cache.py
        - scripts/pipeline/pipeline/phases/fetch_cdp.py
        - scripts/pipeline/pipeline/phases/convert_html.py
  engines:
    - name: mediawiki-api
      implemented_in: scripts/pipeline/pipeline/phases/fetch.py
    - name: scrapling-get
      implemented_in: scripts/explore/probe_chain.py
    - name: obscura-fetch
      implemented_in: configs/engine-registry.json
    - name: obscura-serve-pool
      implemented_in: configs/engine-registry.json
    - name: scrapling-fetch
      implemented_in: scripts/explore/probe_chain.py
    - name: scrapling-bulk-fetch
      implemented_in: scripts/explore/probe_chain.py
    - name: cloakbrowser-fetch
      implemented_in: configs/engine-registry.json
    - name: scrapling-stealthy-fetch
      implemented_in: configs/engine-registry.json
    - name: chrome-devtools-mcp
      implemented_in: configs/engine-registry.json
    - name: chrome-cdp
      implemented_in: configs/engine-registry.json
    - name: cdp-api-bridge
      implemented_in: scripts/pipeline/pipeline/phases/fetch_cdp_api.py

# Existing discover capability: kernels plus explicitly identified thin adapters.
discover:
  audits:
    - name: source_aware_batch_audit
      implemented_in: scripts/explore/batch_audit.py
      capability: discover
      sub_capability: site_analysis
      execution_path: explore
      strategy_variant: config_driven
      input_format: html_generic
      relationship: standalone
      equivalence: tests/test_batch_audit.py
  kernels:
    - name: allpages_discovery
      implemented_in: scripts/explore/discovery_allpages.py
    - name: homepage_discovery
      implemented_in: scripts/explore/discovery_homepage.py
  adapters:
    - name: page_discovery
      implemented_in: scripts/explore/page_discovery.py
      relationship: mirror
    - name: mediawiki_crawl_workflow
      implemented_in: scripts/lib/mediawiki-crawl.mjs
      relationship: infrastructure
    - name: manifest_contract
      implemented_in: scripts/lib/manifest_contract.py
      relationship: infrastructure
    - name: strategy_lifecycle
      implemented_in: scripts/explore/strategy_lifecycle.py
      relationship: infrastructure
    - name: extraction_schema
      implemented_in: scripts/lib/extraction/schema.py
      relationship: infrastructure
